name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Run evaluation with regression gate
        # Fails the build if faithfulness drops below threshold — this is the
        # gate that stops a prompt/model change from silently degrading quality.
        run: |
          PYTHONPATH=src python -m eval_platform.runner \
            --dataset datasets/example_eval_set.jsonl \
            --gate-metric faithfulness \
            --gate-threshold 0.80
